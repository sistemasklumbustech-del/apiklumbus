version: 2
updates:
  # Dependencias de la API y del paquete db (workspaces, un solo package-lock.json en la raíz).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actualizaciones-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
